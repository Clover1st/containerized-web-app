version: '3'
services:
  web:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: clover
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clover -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
